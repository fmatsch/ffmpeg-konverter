appId: com.fmatscheko.ffmpegkonverter
productName: FFmpeg Konverter
copyright: Copyright © fmatscheko

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icons/icon.icns
  category: public.app-category.video

dmg:
  artifactName: '${productName}-${version}-${arch}.${ext}'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icons/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: '${productName}-Setup-${version}.${ext}'

linux:
  target:
    - AppImage
  icon: build/icons/icon.png
  category: AudioVideo
