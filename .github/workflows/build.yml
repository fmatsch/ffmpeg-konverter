name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/generate-icons.mjs

      - run: node scripts/fetch-realesrgan.mjs

      - run: npm run ${{ matrix.script }}

      - name: macOS-Pakete prüfen (Signatur und Architektur)
        if: runner.os == 'macOS'
        run: |
          for pair in mac:x86_64 mac-arm64:arm64; do
            APP="release/${pair%:*}/FFmpeg Konverter.app"
            codesign --verify --deep --strict "$APP"
            for bin in ffmpeg ffprobe; do
              lipo -archs "$APP/Contents/Resources/bin/$bin" | grep -qx "${pair#*:}"
            done
          done

      - name: Windows-Paket prüfen (FFmpeg enthalten und lauffähig)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for bin in ffmpeg ffprobe; do
            "release/win-unpacked/resources/bin/$bin.exe" -version
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-konverter-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
